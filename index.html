<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<meta name="description" content="A small flower that blooms for someone who matters.">

<style>
/* ─────────────────────────────────────────────
   Palette & tokens
   ───────────────────────────────────────────── */
:root{
  --bg:        #FBF8F4;
  --bg-glow:   #FDEDE9;
  --ink:       #2B2724;
  --muted:     #93887E;
  --hairline:  #E4DCD2;

  --stem:      #7E9A72;
  --leaf-a:    #8DAE80;
  --leaf-b:    #5F8459;

  --p1-a:#FBE4E2; --p1-b:#F0B7BB;   /* outer petals */
  --p2-a:#F7D0CE; --p2-b:#E79BA2;   /* middle petals */
  --p3-a:#F0B8BA; --p3-b:#D8828C;   /* inner petals */
  --core-a:#F4C86E; --core-b:#C8933A;
  --pollen:    #E0A9A5;

  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:        #131110;
    --bg-glow:   #2A1E1E;
    --ink:       #F0E9E1;
    --muted:     #9C9086;
    --hairline:  #2E2926;

    --stem:      #7FA073;
    --leaf-a:    #85A87A;
    --leaf-b:    #557A50;

    --p1-a:#F8D8D6; --p1-b:#E7A2A7;
    --p2-a:#F4C0C0; --p2-b:#DE8B94;
    --p3-a:#EBA9AE; --p3-b:#CE727F;
    --core-a:#F6CE79; --core-b:#C88F33;
    --pollen:    #EFC0BB;
  }
}

*{ box-sizing:border-box; }
html,body{ height:100%; }

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  padding:clamp(18px,3.5vh,40px) 20px;
  overflow-x:hidden;
  position:relative;
  --pad:clamp(18px,3.5vh,40px);
}

/* soft warm halo behind everything */
body::before{
  content:"";
  position:fixed; inset:0;
  background:radial-gradient(58% 46% at 50% 34%, var(--bg-glow) 0%, transparent 72%);
  opacity:0; transition:opacity 2.4s ease 0.4s;
  pointer-events:none;
}
body.bloomed::before{ opacity:.85; }

/* ─────────────────────────────────────────────
   Layout
   ───────────────────────────────────────────── */
/* main centres itself vertically, but grows and scrolls normally
   the moment the words outrun the screen */
main{
  width:100%;
  max-width:600px;
  min-height:calc(100dvh - (2 * var(--pad)));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  z-index:1;
}

.eyebrow{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 6px;
  opacity:0;
  animation:fade-in 1.4s ease .2s forwards;
}

.rule{
  width:34px; height:1px;
  background:var(--hairline);
  margin:0 0 clamp(6px,2vw,14px);
  opacity:0;
  animation:fade-in 1.4s ease .5s forwards;
}

/* ─────────────────────────────────────────────
   Flower stage
   ───────────────────────────────────────────── */
/* the flower is sized off viewport height so it never crowds the words */
.stage{
  position:relative;
  display:flex;
  justify-content:center;
  width:100%;
}
.stage svg{
  display:block;
  height:clamp(230px, 42vh, 430px);
  width:auto;
  max-width:100%;
  overflow:visible;
}

/* gentle sway once it has opened */
.sway{ transform-box:view-box; transform-origin:200px 506px; }
.bloomed .sway{ animation:sway 8s ease-in-out 3.4s infinite; }
@keyframes sway{
  0%,100%{ transform:rotate(-1.1deg); }
  50%    { transform:rotate(1.1deg);  }
}

/* stem draws itself upward */
.stem{
  fill:none;
  stroke:var(--stem);
  stroke-width:5;
  stroke-linecap:round;
  stroke-dasharray:1;
  stroke-dashoffset:1;
}
.bloomed .stem{ animation:draw 1.5s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* leaves unfurl from where they meet the stem */
.leaf{
  transform-box:view-box;
  opacity:0;
  transform:scale(.05) rotate(-14deg);
}
.leaf-l{ transform-origin:200px 344px; }
.leaf-r{ transform-origin:200px 414px; }
.bloomed .leaf{ animation:unfurl 1.3s cubic-bezier(.18,.9,.3,1) var(--d) forwards; }
@keyframes unfurl{
  0%  { opacity:0; transform:scale(.05) rotate(-16deg); }
  40% { opacity:1; }
  100%{ opacity:1; transform:scale(1) rotate(0deg); }
}

/* petals open outward from the flower's heart */
.petal{
  transform-box:view-box;
  transform-origin:200px 182px;
  opacity:0;
  transform:rotate(calc(var(--a) + 34deg)) scale(.04);
}
.bloomed .petal{ animation:bloom 1.6s cubic-bezier(.16,.86,.28,1) var(--d) forwards; }
@keyframes bloom{
  0%  { opacity:0; transform:rotate(calc(var(--a) + 34deg)) scale(.04); }
  30% { opacity:1; }
  100%{ opacity:1; transform:rotate(var(--a)) scale(var(--s)); }
}

.core{
  transform-box:view-box;
  transform-origin:200px 182px;
  opacity:0;
  transform:scale(0);
}
.bloomed .core{ animation:pop 1.1s cubic-bezier(.2,1.2,.3,1) 2.5s forwards; }
@keyframes pop{ to{ opacity:1; transform:scale(1); } }

.shadow{
  opacity:0;
  animation:none;
}
.bloomed .shadow{ animation:fade-soft 1.6s ease .6s forwards; }
@keyframes fade-soft{ to{ opacity:.5; } }

/* drifting pollen */
.motes{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.mote{
  position:absolute;
  bottom:22%;
  width:4px; height:4px;
  border-radius:50%;
  background:var(--pollen);
  opacity:0;
}
.bloomed .mote{ animation:drift var(--dur) linear var(--d) infinite; }
@keyframes drift{
  0%  { opacity:0; transform:translate3d(0,0,0) scale(.6); }
  12% { opacity:.55; }
  70% { opacity:.35; }
  100%{ opacity:0; transform:translate3d(var(--x),-190px,0) scale(1); }
}

/* ─────────────────────────────────────────────
   Words
   ───────────────────────────────────────────── */
.verse{
  margin:clamp(10px,3vw,22px) 0 0;
  max-width:min(100%, 500px);   /* wide enough that each line stays one line */
}
.verse p{
  margin:0 0 .5em;
  font-size:clamp(18px,3.6vw,23px);
  line-height:1.45;
  letter-spacing:-.005em;
  text-wrap:balance;
  opacity:0;
  transform:translateY(9px);
}
.bloomed .verse p{ animation:rise 1.5s cubic-bezier(.2,.7,.2,1) var(--d) forwards; }
@keyframes rise{ to{ opacity:1; transform:translateY(0); } }

.verse p.soft{
  font-size:clamp(15px,3.4vw,17px);
  color:var(--muted);
  line-height:1.65;
  font-style:italic;
  margin-top:1.1em;
}

.sign{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
  margin:clamp(18px,4vw,30px) 0 0;
  opacity:0;
}
.bloomed .sign{ animation:fade-in 1.6s ease 6.4s forwards; }

/* ─────────────────────────────────────────────
   Controls
   ───────────────────────────────────────────── */
.controls{
  position:relative;              /* so "again" can sit exactly where "bloom" was */
  margin-top:clamp(16px,4vw,26px);
  min-height:44px;
  display:grid;
  place-items:center;
}

button{
  font-family:var(--sans);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  background:transparent;
  border:1px solid var(--hairline);
  border-radius:999px;
  padding:13px 26px;
  cursor:pointer;
  transition:border-color .5s ease, color .5s ease, opacity .8s ease, transform .5s ease;
}
button:hover{ border-color:var(--p3-b); color:var(--p3-b); }
button:focus-visible{ outline:2px solid var(--p3-b); outline-offset:3px; }
button:active{ transform:scale(.97); }

#bloom-btn{ opacity:0; animation:fade-in 1.4s ease .9s forwards; }
.bloomed #bloom-btn{ opacity:0; pointer-events:none; transition:opacity .5s ease; animation:none; }

#again-btn{
  position:absolute;
  opacity:0; pointer-events:none;
  border-color:transparent;
  color:var(--muted);
}
.bloomed #again-btn{ animation:fade-in 1.4s ease 7s forwards; pointer-events:auto; }
#again-btn:hover{ color:var(--ink); border-color:var(--hairline); }

@keyframes fade-in{ to{ opacity:1; } }

/* ─────────────────────────────────────────────
   Respect reduced motion — same story, no travel
   ───────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-delay:0ms !important; transition-duration:.01ms !important; }
  .bloomed .sway, .bloomed .mote{ animation:none !important; }
  .mote{ display:none; }
}
</style>
</head>

<body>
<main>
  <p class="eyebrow" id="eyebrow">For you</p>
  <div class="rule"></div>

  <div class="stage" id="stage">
    <svg viewBox="0 0 400 540" role="img" aria-labelledby="art-title">
      <title id="art-title">A flower slowly opening</title>

      <defs>
        <radialGradient id="g-p1" cx="50%" cy="96%" r="78%">
          <stop offset="0%"   stop-color="var(--p1-b)"/>
          <stop offset="100%" stop-color="var(--p1-a)"/>
        </radialGradient>
        <radialGradient id="g-p2" cx="50%" cy="96%" r="78%">
          <stop offset="0%"   stop-color="var(--p2-b)"/>
          <stop offset="100%" stop-color="var(--p2-a)"/>
        </radialGradient>
        <radialGradient id="g-p3" cx="50%" cy="96%" r="78%">
          <stop offset="0%"   stop-color="var(--p3-b)"/>
          <stop offset="100%" stop-color="var(--p3-a)"/>
        </radialGradient>
        <radialGradient id="g-core" cx="38%" cy="34%" r="72%">
          <stop offset="0%"   stop-color="var(--core-a)"/>
          <stop offset="100%" stop-color="var(--core-b)"/>
        </radialGradient>
        <linearGradient id="g-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="var(--leaf-b)"/>
          <stop offset="100%" stop-color="var(--leaf-a)"/>
        </linearGradient>
        <radialGradient id="g-shadow">
          <stop offset="0%"   stop-color="var(--stem)" stop-opacity=".38"/>
          <stop offset="100%" stop-color="var(--stem)" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse class="shadow" cx="200" cy="512" rx="72" ry="9" fill="url(#g-shadow)"/>

      <g class="sway">
        <path class="stem" pathLength="1" d="M201 506 C196 428 199 340 200 186"/>

        <path class="leaf leaf-l" style="--d:.95s" fill="url(#g-leaf)"
              d="M200 344 C161 336 126 310 111 272 C154 264 190 302 200 344 Z"/>
        <path class="leaf leaf-r" style="--d:1.25s" fill="url(#g-leaf)"
              d="M200 414 C238 407 272 383 287 347 C245 339 210 375 200 414 Z"/>

        <g id="petals"></g>

        <g class="core">
          <circle cx="200" cy="182" r="19" fill="url(#g-core)"/>
          <g id="stamen" fill="var(--core-b)" opacity=".75"></g>
        </g>
      </g>
    </svg>

    <div class="motes" id="motes" aria-hidden="true"></div>
  </div>

  <div class="verse" id="verse"></div>

  <p class="sign" id="sign"></p>

  <div class="controls">
    <button id="bloom-btn" type="button">Let it bloom</button>
    <button id="again-btn" type="button">Again</button>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   EDIT ME — everything personal lives in this one object.
   You can also override the name in the URL:  index.html?name=Sam
   ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  name:  "",              // your friend's name, e.g. "Sam"  (blank = just "For you")
  from:  "",              // your name, shown at the bottom  (blank = hidden)

  lines: [
    "Some people arrive quietly",
    "and change the shape of everything after.",
    "You are one of those people."
  ],

  // the quieter closing thought
  note: "Thank you for every ordinary day you made better just by being in it.",

  // the last line, in small caps
  closing: "You are loved — more than you'd ever ask to be"
};
/* ═══════════════════════════════════════════════════════════ */


const NS = "http://www.w3.org/2000/svg";

/* ── the petal, drawn from the heart of the flower outward ── */
const PETAL = "M200 182 C167 143 157 96 200 60 C243 96 233 143 200 182 Z";

function layer(count, scale, offset, fill, start, step){
  const g = document.createDocumentFragment();
  for (let i = 0; i < count; i++){
    const p = document.createElementNS(NS, "path");
    // a touch of jitter so no two petals sit perfectly — real flowers don't
    const jitter = (Math.sin(i * 12.9898 + count) * 43758.5453 % 1) * 5 - 2.5;
    p.setAttribute("d", PETAL);
    p.setAttribute("fill", fill);
    p.setAttribute("class", "petal");
    p.style.setProperty("--a", (offset + (360 / count) * i + jitter).toFixed(2) + "deg");
    p.style.setProperty("--s", scale);
    p.style.setProperty("--d", (start + i * step).toFixed(2) + "s");
    g.appendChild(p);
  }
  return g;
}

const petals = document.getElementById("petals");
petals.append(
  layer(8, 1,    22.5, "url(#g-p1)", 1.35, 0.09),   // outer ring
  layer(8, 0.78,  0,   "url(#g-p2)", 1.75, 0.08),   // middle ring
  layer(6, 0.5,  30,   "url(#g-p3)", 2.15, 0.07)    // heart
);

/* ── stamen freckles in the centre ── */
const stamen = document.getElementById("stamen");
for (let i = 0; i < 9; i++){
  const a = (i / 9) * Math.PI * 2;
  const r = i % 2 ? 11 : 6.5;
  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("cx", (200 + Math.cos(a) * r).toFixed(1));
  dot.setAttribute("cy", (182 + Math.sin(a) * r).toFixed(1));
  dot.setAttribute("r", i % 2 ? 1.9 : 1.4);
  stamen.appendChild(dot);
}

/* ── pollen drifting up through the light ── */
const motes = document.getElementById("motes");
for (let i = 0; i < 16; i++){
  const m = document.createElement("span");
  m.className = "mote";
  m.style.left = (8 + Math.random() * 84) + "%";
  m.style.setProperty("--x", (Math.random() * 60 - 30).toFixed(0) + "px");
  m.style.setProperty("--dur", (7 + Math.random() * 7).toFixed(1) + "s");
  m.style.setProperty("--d", (3 + Math.random() * 9).toFixed(1) + "s");
  m.style.transform = "scale(" + (0.5 + Math.random() * 0.9).toFixed(2) + ")";
  motes.appendChild(m);
}

/* ── the words ── */
const name = new URLSearchParams(location.search).get("name") || CONFIG.name;
document.getElementById("eyebrow").textContent = name ? "For " + name : "For you";
if (name) document.title = "For " + name;

const verse = document.getElementById("verse");
let t = 3.1;
CONFIG.lines.forEach(line => {
  const p = document.createElement("p");
  p.textContent = line;
  p.style.setProperty("--d", t.toFixed(2) + "s");
  verse.appendChild(p);
  t += 0.75;
});
if (CONFIG.note){
  const p = document.createElement("p");
  p.className = "soft";
  p.textContent = CONFIG.note;
  p.style.setProperty("--d", (t + 0.35).toFixed(2) + "s");
  verse.appendChild(p);
}

const sign = document.getElementById("sign");
sign.textContent = CONFIG.closing + (CONFIG.from ? " · " + CONFIG.from : "");

/* ── open / start over ──
   the class lives on <body> so the flower, the words and the buttons
   all take their cue from the same moment */
const bloomBtn = document.getElementById("bloom-btn");
const againBtn = document.getElementById("again-btn");

bloomBtn.addEventListener("click", () => document.body.classList.add("bloomed"));

againBtn.addEventListener("click", () => {
  document.body.classList.remove("bloomed");
  void document.body.offsetWidth;   // force a reflow so the animations re-run
  requestAnimationFrame(() => document.body.classList.add("bloomed"));
});
</script>
</body>
</html>
